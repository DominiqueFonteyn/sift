services:
  api:
    build:
      context: .
      dockerfile: src/Sift.Api/Dockerfile
    environment:
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (32+ characters)}
    volumes:
      - sift-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Sift.Web/Dockerfile
    ports:
      - "${SIFT_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sift-data:
