openapi: 3.1.0
info:
  title: Sift API
  version: 0.1.0
tags:
  - name: Bureaus
  - name: Health
  - name: Identity
  - name: Recruiters
  - name: Requirements
  - name: Resumes
  - name: Vacancies
paths:
  /auth/login:
    post:
      operationId: Identity_login
      description: Log in with email and password and receive a JWT. Does not require authentication.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
        - {}
  /auth/me:
    get:
      operationId: Identity_me
      description: Return the account of the signed-in user. Requires a valid bearer token.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Identity
  /auth/register:
    post:
      operationId: Identity_register
      description: Register a new account. Does not require authentication.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '409':
          description: An account already exists for the given email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security:
        - {}
  /bureaus:
    post:
      operationId: Bureaus_create
      description: Add a bureau owned by the signed-in user.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bureau'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Bureaus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBureauRequest'
    get:
      operationId: Bureaus_list
      description: List only the signed-in user's bureaus, one page at a time. An out-of-range page or page size is rejected with 400.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page, between 1 and 100. Defaults to 20.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BureauPage'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Bureaus
  /bureaus/{id}:
    get:
      operationId: Bureaus_get
      description: Get one of the signed-in user's bureaus. Another user's bureau returns 404, same as a missing one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bureau'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The resource does not exist or is not owned by the signed-in user. The two cases are indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Bureaus
  /health:
    get:
      operationId: Health_check
      description: Report whether the API is healthy.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Health
      security:
        - {}
  /recruiters:
    post:
      operationId: Recruiters_create
      description: Add a recruiter owned by the signed-in user.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recruiter'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Recruiters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecruiterRequest'
    get:
      operationId: Recruiters_list
      description: List only the signed-in user's recruiters, one page at a time. An out-of-range page or page size is rejected with 400.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page, between 1 and 100. Defaults to 20.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterPage'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Recruiters
  /requirements:
    post:
      operationId: Requirements_create
      description: Add a requirement owned by the signed-in user. Blank text or an invalid or missing kind returns 400; text the user already has (case-insensitively, after trimming) returns 409.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirement'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: An account already exists for the given email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Requirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequirementRequest'
    get:
      operationId: Requirements_list
      description: List only the signed-in user's requirements, one page at a time. An out-of-range page or page size is rejected with 400.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page, between 1 and 100. Defaults to 20.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementPage'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Requirements
  /requirements/{id}:
    delete:
      operationId: Requirements_delete
      description: Delete one of the signed-in user's requirements. Another user's requirement returns 404, same as a missing one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The resource does not exist or is not owned by the signed-in user. The two cases are indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Requirements
  /resume:
    get:
      operationId: Resumes_getMyResume
      description: Get the signed-in user's resume. Returns 404 when the user has not saved one yet.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The signed-in user has no resume yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Resumes
    put:
      operationId: Resumes_saveMyResume
      description: Create or replace the signed-in user's resume. Blank or oversized text is rejected with 400 and leaves any previous resume unchanged.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Resumes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveResumeRequest'
  /vacancies:
    post:
      operationId: Vacancies_create
      description: Paste a vacancy owned by the signed-in user. Missing, blank or oversized fields are rejected with 400 problem details whose errors are keyed by field; nothing is stored.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Vacancies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVacancyRequest'
    get:
      operationId: Vacancies_list
      description: List only the signed-in user's vacancies, ranked by match score against the user's current resume and requirements (highest first; ties by creation time newest first, then id ascending), one page at a time. Ranking covers all of the user's vacancies and happens before paging. Without a resume or without requirements nothing is scored and the list is newest first, ties by id ascending. A page beyond the end returns empty items with the correct total. An out-of-range page or page size is rejected with 400.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Number of items per page, between 1 and 100. Defaults to 20.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyPage'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Vacancies
  /vacancies/{id}:
    get:
      operationId: Vacancies_get
      description: Get one of the signed-in user's vacancies in full, scored against the user's own resume and requirements. The score is worked out on every request and never stored. A malformed id, an unknown id and another user's vacancy all return the same 404 and nothing is scored.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDetail'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The resource does not exist or is not owned by the signed-in user. The two cases are indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Vacancies
    delete:
      operationId: Vacancies_delete
      description: Permanently delete one of the signed-in user's vacancies. A malformed id, an unknown id, an already-deleted vacancy and another user's vacancy all return the same 404 and nothing is changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The resource does not exist or is not owned by the signed-in user. The two cases are indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Vacancies
security:
  - BearerAuth: []
components:
  schemas:
    Bureau:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the bureau.
        name:
          type: string
          description: Name of the bureau.
        website:
          type: string
          description: Website of the bureau, when one was given.
        createdAt:
          type: string
          format: date-time
          description: When the bureau was created, in UTC.
      description: A bureau owned by the signed-in user.
    BureauPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bureau'
          description: The bureaus on this page.
        total:
          type: integer
          format: int32
          minimum: 0
          description: Total number of the signed-in user's bureaus across all pages.
        page:
          type: integer
          format: int32
          minimum: 1
          description: The 1-based page that was returned.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The maximum number of items per page that was applied.
      description: One page of the signed-in user's bureaus, oldest first.
    CreateBureauRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Name of the bureau. Must contain at least one non-whitespace character; a name made only of whitespace is rejected with 400. At most 200 characters, counted as sent; surrounding whitespace is trimmed when stored.
        website:
          type: string
          maxLength: 2048
          description: Website of the bureau. Optional; when given it must be an absolute http or https URL of at most 2048 characters. An empty or whitespace-only value is treated as not given; surrounding whitespace is trimmed when stored.
      description: The details needed to add a bureau. The owner is always the signed-in user; any owner supplied is ignored.
    CreateRecruiterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Name of the recruiter. Must contain at least one non-whitespace character; a name made only of whitespace is rejected with 400. At most 200 characters, counted as sent; surrounding whitespace is trimmed when stored.
        email:
          type: string
          maxLength: 254
          description: Email address. Optional; when given it must be a well-formed email address of at most 254 characters. An empty or whitespace-only value is treated as not given.
        phone:
          type: string
          maxLength: 50
          description: Phone number as free text; the format is not checked. Optional; at most 50 characters, counted as sent. An empty or whitespace-only value is treated as not given.
        linkedInUrl:
          type: string
          maxLength: 2048
          description: LinkedIn profile URL. Optional; when given it must be an absolute http or https URL of at most 2048 characters. An empty or whitespace-only value is treated as not given.
      description: The details needed to add a recruiter. The owner is always the signed-in user; any owner supplied is ignored.
    CreateRequirementRequest:
      type: object
      required:
        - text
        - kind
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Free text of the requirement. Must contain at least one non-whitespace character; whitespace-only text is rejected with 400. At most 200 characters, counted as sent; surrounding whitespace is trimmed when stored. Unique per user, compared case-insensitively after trimming; a duplicate is rejected with 409.
        kind:
          $ref: '#/components/schemas/RequirementKind'
          description: Whether the requirement is a must-have or a nice-to-have. Required; any other value is rejected with 400.
      description: The details needed to add a job requirement. The owner is always the signed-in user; any owner supplied is ignored.
    CreateVacancyRequest:
      type: object
      required:
        - title
        - company
        - rawText
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Job title. Must contain at least one non-whitespace character. At most 200 characters, counted as sent; surrounding whitespace is trimmed when stored.
        company:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Hiring company. Must contain at least one non-whitespace character. At most 200 characters, counted as sent; surrounding whitespace is trimmed when stored.
        rawText:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
          description: The pasted vacancy text. Must contain at least one non-whitespace character. At most 20,000 characters, counted as sent in UTF-16 code units (JavaScript string length), with no trimming before counting; stored exactly as sent.
      description: The vacancy to paste. The owner is always the signed-in user; any owner, id or creation time supplied is ignored.
    CurrentUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the account.
        email:
          type: string
          description: Normalised email address of the account.
      description: The account of the signed-in user.
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
          description: Liveness of the API.
      description: The result of a health probe.
    HealthStatus:
      type: string
      enum:
        - healthy
        - unhealthy
      description: Reported liveness of the API.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
          description: Email address of the account.
        password:
          type: string
          maxLength: 128
          format: password
          description: Plain-text password of the account.
      description: The credentials of an existing account.
    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
          description: Signed JWT containing the user id and an expiry.
        tokenType:
          type: string
          enum:
            - Bearer
          description: Always Bearer.
        expiresAt:
          type: string
          format: date-time
          description: When the token expires, in UTC.
      description: A signed-in session. Send the token as a bearer token on protected requests.
    MatchInput:
      type: string
      enum:
        - resume
        - requirements
      description: An input the signed-in user must provide before a vacancy can be scored.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
      description: RFC 7807 problem details. Every error response uses this shape.
    Recruiter:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the recruiter.
        name:
          type: string
          description: Name of the recruiter.
        email:
          type: string
          description: Email address, when one was given.
        phone:
          type: string
          description: Phone number, when one was given.
        linkedInUrl:
          type: string
          description: LinkedIn profile URL, when one was given.
        createdAt:
          type: string
          format: date-time
          description: When the recruiter was created, in UTC.
      description: A recruiter owned by the signed-in user.
    RecruiterPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recruiter'
          description: The recruiters on this page.
        total:
          type: integer
          format: int32
          minimum: 0
          description: Total number of the signed-in user's recruiters across all pages.
        page:
          type: integer
          format: int32
          minimum: 1
          description: The 1-based page that was returned.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The maximum number of items per page that was applied.
      description: One page of the signed-in user's recruiters, oldest first.
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Email address used to identify the account. Unique across all accounts.
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: Plain-text password, only ever sent over the wire and never stored. At least 8 characters.
      description: The details needed to create an account.
    RegisteredUser:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the new account.
        email:
          type: string
          description: Normalised email address of the account.
        createdAt:
          type: string
          format: date-time
          description: When the account was created, in UTC.
      description: The account that was created. Never contains the password or its hash.
    Requirement:
      type: object
      required:
        - id
        - text
        - kind
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the requirement.
        text:
          type: string
          description: Free text of the requirement.
        kind:
          $ref: '#/components/schemas/RequirementKind'
          description: Whether the requirement is a must-have or a nice-to-have.
        createdAt:
          type: string
          format: date-time
          description: When the requirement was created, in UTC.
      description: A job requirement owned by the signed-in user.
    RequirementKind:
      type: string
      enum:
        - must-have
        - nice-to-have
      description: 'How strongly a requirement counts: a must-have is a deal-breaker, a nice-to-have is a bonus.'
    RequirementPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: The requirements on this page.
        total:
          type: integer
          format: int32
          minimum: 0
          description: Total number of the signed-in user's requirements across all pages.
        page:
          type: integer
          format: int32
          minimum: 1
          description: The 1-based page that was returned.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The maximum number of items per page that was applied.
      description: One page of the signed-in user's requirements, oldest first.
    RequirementVerdict:
      type: object
      required:
        - requirement
        - kind
        - verdict
        - explanation
      properties:
        requirement:
          type: string
          description: The requirement term.
        kind:
          $ref: '#/components/schemas/RequirementKind'
          description: Whether the requirement is a must-have or a nice-to-have.
        verdict:
          $ref: '#/components/schemas/VerdictOutcome'
          description: Whether the term was found in the vacancy text.
        explanation:
          type: string
          description: Names the requirement term and says whether it was found in the vacancy text.
      description: The verdict for one of the signed-in user's requirements.
    Resume:
      type: object
      required:
        - text
        - updatedAt
      properties:
        text:
          type: string
          description: Plain-text resume, exactly as saved.
        updatedAt:
          type: string
          format: date-time
          description: When the resume was last saved, in UTC, taken from the application clock.
      description: The signed-in user's resume.
    SaveResumeRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
          description: Plain-text resume. Must contain at least one non-whitespace character; blank or whitespace-only text is rejected with 400. At most 20,000 characters, counted as sent in UTF-16 code units (JavaScript string length), with no trimming before counting.
      description: The resume text to save. The signed-in user's single resume is created or replaced.
    Vacancy:
      type: object
      required:
        - id
        - title
        - company
        - rawText
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the vacancy.
        title:
          type: string
          description: Job title, trimmed.
        company:
          type: string
          description: Hiring company, trimmed.
        rawText:
          type: string
          description: The vacancy text, exactly as pasted.
        createdAt:
          type: string
          format: date-time
          description: When the vacancy was created, in UTC, taken from the application clock.
      description: A vacancy owned by the signed-in user.
    VacancyDetail:
      type: object
      required:
        - id
        - title
        - company
        - rawText
        - createdAt
        - match
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the vacancy.
        title:
          type: string
          description: Job title, trimmed.
        company:
          type: string
          description: Hiring company, trimmed.
        rawText:
          type: string
          description: The vacancy text, exactly as pasted.
        createdAt:
          type: string
          format: date-time
          description: When the vacancy was created, in UTC, taken from the application clock.
        match:
          $ref: '#/components/schemas/VacancyMatch'
          description: How the vacancy scores against the signed-in user's resume and requirements.
      description: A vacancy owned by the signed-in user, together with how it scores.
    VacancyListItem:
      type: object
      required:
        - id
        - title
        - company
        - createdAt
        - score
        - failsMustHave
        - unmetMustHaves
        - verdicts
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the vacancy.
        title:
          type: string
          description: Job title.
        company:
          type: string
          description: Hiring company.
        createdAt:
          type: string
          format: date-time
          description: When the vacancy was created, in UTC.
        score:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 0
          maximum: 100
          description: Overall score, an integer from 0 to 100, worked out against the signed-in user's current resume and requirements on every request. Null when an input is missing.
        failsMustHave:
          type: boolean
          description: True when at least one of the user's must-haves is not found in the vacancy text. Always false when the vacancy is not scored.
        unmetMustHaves:
          type: array
          items:
            type: string
          description: The must-have terms not found in the vacancy text. Empty when none failed or the vacancy is not scored.
        verdicts:
          type: array
          items:
            $ref: '#/components/schemas/RequirementVerdict'
          description: One verdict per requirement with its explanation, unmet must-haves first, in the same order as on the vacancy detail. Empty when the vacancy is not scored.
      description: A vacancy as shown in the list; the raw text is not included.
    VacancyMatch:
      type: object
      required:
        - score
        - verdicts
        - missingInputs
      properties:
        score:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 0
          maximum: 100
          description: Overall score, an integer from 0 to 100. A vacancy meeting every must-have scores at least 50; one with an unmet must-have scores at most 49. Null when an input is missing.
        verdicts:
          type: array
          items:
            $ref: '#/components/schemas/RequirementVerdict'
          description: One verdict per requirement, unmet must-haves first. Empty when an input is missing.
        missingInputs:
          type: array
          items:
            $ref: '#/components/schemas/MatchInput'
          description: The inputs the user still has to provide, resume first. Empty when the vacancy was scored.
      description: How a vacancy scores against the signed-in user's resume and requirements. It is worked out each time the vacancy is opened and is never stored. Without a resume or without requirements there is no score and no verdicts, and the missing inputs are listed instead.
    VacancyPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - missingInputs
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VacancyListItem'
          description: The vacancies on this page.
        total:
          type: integer
          format: int32
          minimum: 0
          description: Total number of the signed-in user's vacancies across all pages.
        page:
          type: integer
          format: int32
          minimum: 1
          description: The 1-based page that was returned.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The maximum number of items per page that was applied.
        missingInputs:
          type: array
          items:
            $ref: '#/components/schemas/MatchInput'
          description: The inputs the user still has to provide before vacancies can be scored, resume first. Empty when vacancies were scored.
      description: One page of the signed-in user's vacancies. The whole list is ranked first and then paged. With a resume and at least one requirement the order is score highest first, then creation time newest first, then id ascending (lowercase canonical UUID text). When an input is missing nothing is scored and the order is creation time newest first, then id ascending.
    ValidationProblemDetails:
      type: object
      required:
        - errors
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation messages keyed by the request field they apply to.
      description: Problem details for a rejected request, listing the offending fields.
    VerdictOutcome:
      type: string
      enum:
        - met
        - not met
      description: Whether one requirement was found in the vacancy text.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
