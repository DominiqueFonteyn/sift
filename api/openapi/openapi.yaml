openapi: 3.1.0
info:
  title: Sift API
  version: 0.1.0
tags:
  - name: Health
  - name: Identity
paths:
  /auth/login:
    post:
      operationId: Identity_login
      description: Log in with email and password and receive a JWT. Does not require authentication.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
        - {}
  /auth/me:
    get:
      operationId: Identity_me
      description: Return the account of the signed-in user. Requires a valid bearer token.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The credentials are wrong, or the bearer token is missing, invalid or expired. Never reveals whether an email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Identity
  /auth/register:
    post:
      operationId: Identity_register
      description: Register a new account. Does not require authentication.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          description: The request was rejected because one or more fields are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '409':
          description: An account already exists for the given email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security:
        - {}
  /health:
    get:
      operationId: Health_check
      description: Report whether the API is healthy.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Health
      security:
        - {}
security:
  - BearerAuth: []
components:
  schemas:
    CurrentUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the account.
        email:
          type: string
          description: Normalised email address of the account.
      description: The account of the signed-in user.
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
          description: Liveness of the API.
      description: The result of a health probe.
    HealthStatus:
      type: string
      enum:
        - healthy
        - unhealthy
      description: Reported liveness of the API.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
          description: Email address of the account.
        password:
          type: string
          maxLength: 128
          format: password
          description: Plain-text password of the account.
      description: The credentials of an existing account.
    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
          description: Signed JWT containing the user id and an expiry.
        tokenType:
          type: string
          enum:
            - Bearer
          description: Always Bearer.
        expiresAt:
          type: string
          format: date-time
          description: When the token expires, in UTC.
      description: A signed-in session. Send the token as a bearer token on protected requests.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
      description: RFC 7807 problem details. Every error response uses this shape.
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Email address used to identify the account. Unique across all accounts.
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: Plain-text password, only ever sent over the wire and never stored. At least 8 characters.
      description: The details needed to create an account.
    RegisteredUser:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the new account.
        email:
          type: string
          description: Normalised email address of the account.
        createdAt:
          type: string
          format: date-time
          description: When the account was created, in UTC.
      description: The account that was created. Never contains the password or its hash.
    ValidationProblemDetails:
      type: object
      required:
        - errors
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation messages keyed by the request field they apply to.
      description: Problem details for a rejected request, listing the offending fields.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
